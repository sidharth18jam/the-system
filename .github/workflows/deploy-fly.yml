name: Deploy to Fly

# Deploys main to Fly only after the Test workflow has passed on that exact commit, so a
# broken push never reaches players. Does nothing until a FLY_API_TOKEN repository secret
# exists (see DEPLOY.md). Can also be run by hand from the Actions tab.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when Fly is not set up
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN secret not set; skipping the Fly deploy."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
