# Fly.io config for The System. Deploy either way:
#   - Dashboard: fly.io → Launch an App → pick this GitHub repo (it reads this file), or
#   - CLI: `fly launch --no-deploy` once (pick an app name), then `fly deploy`.
# Fly may rename `app` to whatever name you pick at launch; app names are global on Fly.
app = "the-system-game"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STATE_FILE = "/data/rooms-state.json"
  # Abandoned games (everyone gone) are dropped after 6h instead of 24h, and at most 1000
  # rooms are held. Public traffic (e.g. a Reddit post) leaves many dead games behind; each
  # costs ~160 KB in memory plus its share of every snapshot write, so these keep the
  # process well inside 1 GB.
  ROOM_IDLE_MS = "21600000"
  MAX_ROOMS = "1000"

[http_service]
  internal_port = 8080
  force_https = true
  # One always-on machine: rooms live in this process's memory, and Socket.IO needs every
  # player in a room on the same machine. Don't scale this app past one machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Every open page holds one WebSocket (the client connects on load, before joining a room),
  # so this counts lurkers on the home screen too. Fly's default is 25; sockets are cheap.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

[[http_service.checks]]
  method = "get"
  path = "/healthz"
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Durable snapshot storage so in-progress games survive deploys and restarts.
# Fly creates it on first launch; if a deploy says the volume is missing, run:
#   fly volumes create system_data --size 1 --region sin
[mounts]
  source = "system_data"
  destination = "/data"
